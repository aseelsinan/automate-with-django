{% if messages %}
<div class="messages mt-4" id="messages">
  {% for message in messages %}
  <div
    {% if message.tags %}
    class="alert alert-{{ message.tags }} custom-alert alert-dismissible fade show d-flex align-items-center justify-content-between overflow-x-auto"
    {% else %}
    class="alert alert-info custom-alert alert-dismissible fade show d-flex align-items-center justify-content-between overflow-x-auto"
    {% endif %}
    role="alert"
  >
    <div class="d-flex align-items-center gap-3">
      <span class="alert-icon-box">
        {% if 'success' in message.tags %}
          <i class="bi bi-check-circle-fill"></i>
        {% elif 'danger' in message.tags or 'error' in message.tags %}
          <i class="bi bi-exclamation-octagon-fill"></i>
        {% elif 'warning' in message.tags %}
          <i class="bi bi-exclamation-triangle-fill"></i>
        {% else %}
          <i class="bi bi-info-circle-fill"></i>
        {% endif %}
      </span>
      <div class="alert-text">{{ message }}</div>
    </div>
    <button
      type="button"
      class="btn-close ms-3"
      data-bs-dismiss="alert"
      aria-label="Close"
    ></button>
  </div>
  {% endfor %}
</div>
{% endif %}
