{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automate Booring Stuff With Django</title>
  </head>
  <body>
    <div class='container'>
      <h3 class="text-capitalize text-center ">Import Data To Database Table</h3>
      <form action="{%url 'import-data'%}" method="POST" enctype="multipart/form-data" style="max-width:600px; margin: auto; padding-top: 50px; ">
        {% csrf_token %} 
        <div class='mt-2'>
           <label for="file-path">Upload CSV File</label>
        <input required type="file" name="file_path" id="form-control" class="form-control">
       
        </div>
        <div class='mt-2'>
           <label for="model-name">Select Database Table </label>
       <select input required name="model-name" id="" class="form-control">
        <option value="" disabled selected>Select</option>
        {% for model in  all_models %}
        <option value="{{model}}">{{model}}</option>
        {% endfor %}
       </select>
       
        </div>
        <button class="btn btn-primary mt-1 " type="submit">Start</button>
        {%include 'alerts.html'%}
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="{% static 'js/custom.js' %}"></script>
  </body>
</html>
