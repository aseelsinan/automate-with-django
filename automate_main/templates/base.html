{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automate The Boring Stuff With Django</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.8 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="{% static 'css/home.css' %}">

  </head>
  <body>
    <!-- Ambient Background Glows -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Navbar -->
    <nav class="custom-navbar">
      <div class="container d-flex align-items-center justify-content-between">
        <a class="brand-logo" href="{% url 'home' %}">
          <span class="brand-icon"><i class="bi bi-lightning-charge-fill"></i></span>
          <span>Automate With Django</span>
        </a>

        <div class="d-flex align-items-center gap-2">
          <!-- Theme Switcher Button -->
          <button
            class="theme-toggle me-1"
            id="themeToggle"
            type="button"
            title="Toggle Dark/Light Mode"
          >
            <i class="bi bi-sun-fill" id="themeIcon"></i>
          </button>

          {% if user.is_authenticated %}
            <!-- يظهر في حال كان المستخدم مسجلاً للدخول -->
            <div class="user-pill d-none d-sm-inline-flex me-1">
              <span class="user-avatar">{{ user.username|slice:":1" }}</span>
              <span>{{ user.username }}</span>
              <span class="status-dot" title="Online"></span>
            </div>

            <a href="{% url 'logout' %}" class="btn-logout">
              <i class="bi bi-box-arrow-right"></i>
              <span>Logout</span>
            </a>
          {% else %}
            <!-- يظهر في حال كان الزائر غير مسجل للدخول -->
            <a href="{% url 'login' %}" class="text-decoration-none btn-login">Login</a>
            <a href="{% url 'register' %}" class="text-decoration-none btn-register">Register</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <!-- مساحة المحتوى المتغير -->
    {% block content %}
    {% endblock content %}

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- Interactive Theme Switcher & Live Search Script -->
    <script src="{% static 'js/home.js' %}"></script>

  </body>
</html>
