{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/register.css' %}">
<div class="container py-4">
  <div class="auth-card">
    <div class="text-center">
      <div class="auth-icon">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h3 class="fw-bold mb-1">Create an Account</h3>
      <p class="small mb-4" style="color: var(--text-secondary);">
        Join us to automate your daily workflows
      </p>
    </div>

    <!-- نموذج التسجيل -->
    <form action="{% url 'register' %}" method="POST" id="registerForm">
      {% csrf_token %}

      <!-- حقل اسم المستخدم -->
      <div class="input-wrapper">
        <input 
          type="text" 
          name="username" 
          class="form-control-custom" 
          placeholder="Username" 
          required
        >
        <i class="bi bi-person input-icon"></i>
      </div>

      <!-- حقل البريد الإلكتروني -->
      <div class="input-wrapper">
        <input 
          type="email" 
          name="email" 
          class="form-control-custom" 
          placeholder="Email Address" 
          required
        >
        <i class="bi bi-envelope input-icon"></i>
      </div>

      <!-- حقل كلمة المرور -->
      <div class="input-wrapper">
        <input 
          type="password" 
          name="password" 
          class="form-control-custom" 
          placeholder="Password" 
          required
        >
        <i class="bi bi-lock input-icon"></i>
      </div>

      <!-- حقل تأكيد كلمة المرور -->
      <div class="input-wrapper">
        <input 
          type="password" 
          name="confirm_password" 
          class="form-control-custom" 
          placeholder="Confirm Password" 
          required
        >
        <i class="bi bi-shield-lock input-icon"></i>
      </div>

      <!-- زر الإرسال -->
      <button type="submit" class="btn btn-auth">
        Register <i class="bi bi-arrow-right ms-1"></i>
      </button>

      <!-- استدعاء التنبيهات في حال وجود أخطاء (مثل تطابق كلمات المرور) -->
      <div class="mt-3">
        {% include 'alerts.html' %}
      </div>
    </form>

    <!-- رابط التحويل لصفحة تسجيل الدخول -->
    <div class="auth-links">
      Already have an account? <a href="#">Login here</a>
    </div>
  </div>
</div>

{% endblock content %}
