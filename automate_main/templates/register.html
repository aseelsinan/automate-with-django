{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

<!-- يجب أن يكون هذا الوسم موجوداً ومكتوباً بشكل صحيح هنا -->
{% block content %}<link rel="stylesheet" href="{% static 'css/register.css' %}" />

<div class="container py-4">
  <div class="auth-card">
    <div class="text-center">
      <div class="auth-icon">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h3 class="fw-bold mb-1">Create an Account</h3>
      <p class="small mb-4" style="color: var(--text-secondary)">
        Join us to automate your daily workflows
      </p>
    </div>

   

    <form
      action="{% url 'register' %}"
      method="POST"
      id="registerForm"
      novalidate
    >
      {% csrf_token %}

      <!-- Crispy Form النظيف -->
      {{ form|crispy }}

      <button type="submit" class="btn btn-auth mt-3">
        <span>Create Account</span>
        <i class="bi bi-arrow-right"></i>
      </button>

      <div class="mt-3">{% include 'alerts.html' %}</div>
    </form>

    <div class="auth-links">
      Already have an account? <a href="#">Login here</a>
    </div>
  </div>
</div>
<script src='{% static "js/register.js" %}'></script>


{% endblock content %}
